# Nexus OS installer defaults for the Debian 13.7 amd64 netinst image.
# Disk partitioning remains interactive; this file never selects or erases a disk.
d-i debian-installer/locale string pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i time/zone string America/Sao_Paulo
d-i netcfg/choose_interface select auto
d-i tasksel/first multiselect standard, xfce-desktop
d-i pkgsel/include string sudo xfce4 xfce4-terminal lightdm network-manager network-manager-gnome firefox-esr nmap lynis recon-ng sqlmap sqlitebrowser john hashcat hydra aircrack-ng wifite gdb wireshark ettercap-text-only suricata yara gnupg keepassxc tor torsocks i2pd dnscrypt-proxy firejail apparmor tcpdump clamav sleuthkit autopsy foremost binwalk testdisk ca-certificates curl less nano locales keyboard-configuration fonts-dejavu-core python3 nodejs git
d-i pkgsel/upgrade select none
d-i preseed/late_command string cp -a /cdrom/nexus-root/. /target/; in-target chown -R root:root /usr/share/nexus-os; in-target install -d -o www-data -g www-data /var/lib/nexus-godseye; in-target chmod 0755 /usr/local/bin/nexus-openjarvis-install; in-target systemctl enable nexus-godseye.service
d-i finish-install/reboot_in_progress note
